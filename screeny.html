<script>
function showAdjacentScreen(offset) {
  var links = Array.from(document.querySelectorAll('a[href^="screeny/"]'));
  var current = document.getElementById('screen-image').src;
  var index = links.findIndex(function (link) { return link.href === current; });
  links[(index + offset + links.length) % links.length].click();
}
document.getElementById('screen-prev').addEventListener('click', function () { showAdjacentScreen(-1); });
document.getElementById('screen-next').addEventListener('click', function () { showAdjacentScreen(1); });
document.addEventListener('click', function (event) {
  var link = event.target.closest('a[href^="screeny/"]');
  if (!link || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
  event.preventDefault();
  var thumb = link.querySelector('img');
  var preview = document.getElementById('screen-preview');
  var image = document.getElementById('screen-image');
  image.src = link.href;
  image.alt = thumb ? thumb.alt : '';
  document.getElementById('screen-caption').textContent = image.alt;
  preview.hidden = false;
  window.scrollTo(0, 0);
});
</script>
